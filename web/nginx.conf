# 生产前端 Nginx 配置：静态托管 + 同源反代后端。
# 反代目标与本地 vite.config.ts 的 proxy 一致（/health、/docs、/openapi.json、/v1 -> api:8000），
# 因此前端无需修改，浏览器始终同源。

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 分块上传每块 5 MiB，放宽请求体上限以留足余量
    client_max_body_size 64m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API（含 SSE 流式对话）：必须关闭代理缓冲，否则流式响应会被缓冲到结束才下发
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health/live  { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /health/ready { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /docs           { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Host $host; }
}
