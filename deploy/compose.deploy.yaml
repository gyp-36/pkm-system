# 云服务器专用自包含 Compose：只用预构建镜像，不含 build，服务器上无需源码。
#   docker load < pkm-api-prod.tar.gz
#   docker load < pkm-web-prod.tar.gz
#   docker compose --env-file .env.prod -f deploy/compose.deploy.yaml up -d --wait
#
# 与仓库内 compose.yaml / compose.prod.yaml 等价，但：
#   - api / web 直接用已加载的 pkm-api:prod、pkm-web:prod 镜像（去掉了 build）
#   - 已内置生产覆盖：OBJECT_STORAGE_PUBLIC_ENDPOINT 指向公网对象存储子域
#   - 依赖镜像（pgvector / ollama / minio）由服务器自行拉取或复用
#   - 不启用 office profile（2GB 实例不跑 ONLYOFFICE）

name: pkm-system

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-production}
  ASSISTANT_TRACE_VIEW_ENABLED: ${ASSISTANT_TRACE_VIEW_ENABLED:-false}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  OLLAMA_URL: http://ollama:11434
  OLLAMA_INFERENCE_QUEUE_TIMEOUT_SECONDS: "300"
  EMBEDDING_MODEL: qwen3-embedding:0.6b
  VISION_MODEL: ${VISION_MODEL:-qwen3-vl:2b-instruct}
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_PUBLIC_ENDPOINT: https://${OBJECT_STORAGE_DOMAIN}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-pkm-files}
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?请设置 OBJECT_STORAGE_ACCESS_KEY}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?请设置 OBJECT_STORAGE_SECRET_KEY}
  PKM_CREDENTIAL_KEY: ${PKM_CREDENTIAL_KEY:?请设置 PKM_CREDENTIAL_KEY}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.35.0
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_HOST_PORT:-19000}:9000"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  model-init:
    image: pkm-api:prod
    profiles: ["model-setup"]
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl:2b-instruct}
    command: ["/app/.venv/bin/python", "-m", "app.ops.model_bootstrap"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  migrate:
    image: pkm-api:prod
    environment: *api-environment
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: pkm-api:prod
    environment:
      <<: *api-environment
      NOTE_FILE_ROOT: /data/note-files
      PKM_FILE_LINK_SECRET: ${PKM_FILE_LINK_SECRET:?请设置 PKM_FILE_LINK_SECRET}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-local-onlyoffice-secret}
      PUBLIC_APP_URL: http://api:8000
    volumes:
      - note_files:/data/note-files
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "app.ops.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    image: pkm-api:prod
    environment: *api-environment
    command: ["/app/.venv/bin/python", "-m", "app.ops.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  digest-worker:
    image: pkm-api:prod
    environment: *api-environment
    command: ["/app/.venv/bin/python", "-m", "app.ops.digest_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ingest-worker:
    image: pkm-api:prod
    environment:
      <<: *api-environment
      INGEST_WORKER_EXTENSIONS: pdf,png
    command: ["/app/.venv/bin/python", "-m", "app.ops.ingest_worker"]
    volumes:
      - note_files:/data/note-files
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

  parse-worker:
    image: pkm-api:prod
    environment:
      <<: *api-environment
      INGEST_WORKER_EXTENSIONS: md,docx,xlsx,doc,xls
      RUN_INGEST_MAINTENANCE: "false"
    command: ["/app/.venv/bin/python", "-m", "app.ops.ingest_worker"]
    volumes:
      - note_files:/data/note-files
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: unless-stopped

  link-fetch-worker:
    image: pkm-api:prod
    environment: *api-environment
    command: ["/app/.venv/bin/python", "-m", "app.ops.link_fetch_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: pkm-web:prod
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  note_files:
  minio_data:
