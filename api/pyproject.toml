[project]
name = "pkm-api"
version = "0.1.0"
description = "Personal knowledge management API and indexing worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "fastapi==0.142.2",
    "python-multipart>=0.0.20,<1",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
    "beautifulsoup4>=4.13,<5",
    "PyJWT>=2.10,<3",
    "Pillow>=11,<13",
    "httpx==0.28.1",
    "boto3>=1.43,<2",
    "pypdfium2>=4.30,<6",
    "langchain==1.4.3",
    "langchain-openai==1.6.7",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
