[project]
name = "pkm-api"
version = "0.1.0"
description = "Personal knowledge management API and indexing worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "langchain==1.4.3",
    "langchain-openai==1.6.7",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
