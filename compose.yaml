name: pkm-system

x-api-image: &api-image
  build:
    context: ./api
  image: pkm-api:local

x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  OLLAMA_URL: http://ollama:11434
  EMBEDDING_MODEL: qwen3-embedding:0.6b

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.35.0
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  model-init:
    <<: *api-image
    profiles: ["model-setup"]
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: qwen3-embedding:0.6b
    command: ["/app/.venv/bin/python", "-m", "app.model_bootstrap"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *api-image
    environment: *api-environment
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    environment:
      <<: *api-environment
      PKM_CREDENTIAL_KEY: ${PKM_CREDENTIAL_KEY:?run scripts/dev-up.py to create a local encryption key}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *api-image
    environment: *api-environment
    command: ["/app/.venv/bin/python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: pkm-web:local
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
