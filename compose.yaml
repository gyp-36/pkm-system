name: pkm-system

x-api-image: &api-image
  build:
    context: ./api
  image: pkm-api:local

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-production}
  ASSISTANT_TRACE_VIEW_ENABLED: ${ASSISTANT_TRACE_VIEW_ENABLED:-false}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  OLLAMA_URL: http://ollama:11434
  OLLAMA_INFERENCE_QUEUE_TIMEOUT_SECONDS: "300"
  EMBEDDING_MODEL: qwen3-embedding:0.6b
  VISION_MODEL: ${VISION_MODEL:-qwen3-vl:2b-instruct}
  # 模型 provider：本地开发默认 ollama（同机容器，行为不变）。
  # 生产可设为 openai，指向任意 OpenAI 兼容服务（如百炼 DashScope），从而去掉 ollama 容器。
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  VISION_PROVIDER: ${VISION_PROVIDER:-ollama}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  VISION_BASE_URL: ${VISION_BASE_URL:-}
  VISION_API_KEY: ${VISION_API_KEY:-}
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:${OBJECT_STORAGE_HOST_PORT:-19000}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-pkm-files}
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?run scripts/dev-up.py to create local storage credentials}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?run scripts/dev-up.py to create local storage credentials}
  PKM_CREDENTIAL_KEY: ${PKM_CREDENTIAL_KEY:?run scripts/dev-up.py to create a local encryption key}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.35.0
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?run scripts/dev-up.py to create local storage credentials}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?run scripts/dev-up.py to create local storage credentials}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_HOST_PORT:-19000}:9000"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  model-init:
    <<: *api-image
    profiles: ["model-setup"]
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl:2b-instruct}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
    command: ["/app/.venv/bin/python", "-m", "app.ops.model_bootstrap"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *api-image
    environment: *api-environment
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    environment:
      <<: *api-environment
      NOTE_FILE_ROOT: /data/note-files
      PKM_FILE_LINK_SECRET: ${ONLYOFFICE_JWT_SECRET:-local-onlyoffice-secret}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-local-onlyoffice-secret}
      ONLYOFFICE_PUBLIC_URL: http://localhost:${ONLYOFFICE_HOST_PORT:-8080}
      ONLYOFFICE_INTERNAL_URL: http://documentserver
      PUBLIC_APP_URL: http://api:8000
    volumes:
      - note_files:/data/note-files
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "app.ops.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *api-image
    environment: *api-environment
    command: ["/app/.venv/bin/python", "-m", "app.ops.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  digest-worker:
    <<: *api-image
    environment: *api-environment
    command: ["/app/.venv/bin/python", "-m", "app.ops.digest_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ingest-worker:
    <<: *api-image
    environment:
      <<: *api-environment
      INGEST_WORKER_EXTENSIONS: pdf,png
    command: ["/app/.venv/bin/python", "-m", "app.ops.ingest_worker"]
    volumes:
      - note_files:/data/note-files
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

  parse-worker:
    <<: *api-image
    environment:
      <<: *api-environment
      INGEST_WORKER_EXTENSIONS: md,docx,xlsx,doc,xls
      RUN_INGEST_MAINTENANCE: "false"
    command: ["/app/.venv/bin/python", "-m", "app.ops.ingest_worker"]
    volumes:
      - note_files:/data/note-files
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: unless-stopped

  link-fetch-worker:
    <<: *api-image
    environment: *api-environment
    command: ["/app/.venv/bin/python", "-m", "app.ops.link_fetch_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  documentserver:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:latest}
    profiles: ["office"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-local-onlyoffice-secret}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    ports:
      - "127.0.0.1:${ONLYOFFICE_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: pkm-web:local
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # 契约门禁：构建前静态检查（响应契约覆盖、tool 信封、归属过滤）。红灯即阻止部署。
  contract-check:
    <<: *api-image
    profiles: ["gate"]
    environment: *api-environment
    command: ["/app/.venv/bin/python", "-m", "scripts.contract_check", "--static"]
    restart: "no"

volumes:
  postgres_data:
  ollama_data:
  note_files:
  minio_data:
